
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Management Database</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Waste Management System</h1>
        <p>Waste items retrieved from the MySQL database</p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Waste Item</th>
                    <th>Material</th>
                    <th>Disposal Method</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.item_name }}</td>
                    <td>{{ item.material }}</td>
                    <td>{{ item.disposal_method }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
